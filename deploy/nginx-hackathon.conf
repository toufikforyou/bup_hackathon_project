# =============================================================================
# /etc/nginx/sites-available/hackathon.buddy.bd
# Drop this onto the VM at:
#   /etc/nginx/sites-available/hackathon.buddy.bd
#   ln -s /etc/nginx/sites-available/hackathon.buddy.bd /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Flow:
#   internet (80/443) -> nginx -> 127.0.0.1:8080 -> FrankenPHP container
# =============================================================================

# --- 1. HTTP -> HTTPS redirect + ACME challenge ---------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name hackathon.buddy.bd 20.2.64.135;

    # Let's Encrypt http-01 challenge (don't redirect this path).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Pixel-friendly default: redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 2. HTTPS -> FrankenPHP -----------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name hackathon.buddy.bd;

    # ===== TLS (Let's Encrypt) ==============================================
    ssl_certificate     /etc/letsencrypt/live/hackathon.buddy.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackathon.buddy.bd/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ===== Security headers ===============================================
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff"    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ===== Logs ===========================================================
    access_log /var/log/nginx/hackathon.buddy.bd.access.log;
    error_log  /var/log/nginx/hackathon.buddy.bd.error.log warn;

    # ===== Upstream =======================================================
    # FrankenPHP container is bound to 127.0.0.1:8080 via docker-compose.
    set $app_upstream http://127.0.0.1:8080;

    # Per-request timeouts.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;     # 30s is the judge SLA; 60s gives buffer.
    proxy_read_timeout    60s;

    # Pass real client info through.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Resource limits / buffer tuning.
    client_max_body_size 4m;
    proxy_buffering on;
    proxy_buffers   16 16k;
    proxy_buffer_size 32k;

    # Health bypass — return 200 instantly, don't touch the app.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # ACME renewal hooks may also serve /.well-known on 443 (rare but safe).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Everything else -> FrankenPHP.
    location / {
        proxy_pass $app_upstream;
    }
}

