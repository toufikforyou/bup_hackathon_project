services:
    gridoptima:
        build: .
        image: gridoptima:local
        container_name: gridoptima

        # IP-only HTTP mode: bind container :8080 to host :80 directly (no nginx).
        # Comment out the next line and uncomment the loopback one if you put
        # nginx/certbot in front of this later.
        ports:
            - "80:8080"
        # ports:
        #   - "127.0.0.1:8080:8080"

        env_file:
            - .env.production

        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            GRIDWISE_LLM_DRIVER: ${GRIDWISE_LLM_DRIVER:-gemini}
            GEMINI_API_KEY: ${GEMINI_API_KEY:-}
            GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

        # Persistent volumes — survive `docker compose down`.
        volumes:
            - gridoptima_storage:/var/www/html/storage
            - gridoptima_db:/var/www/html/database

        restart: unless-stopped

        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
            # Disabled because we publish :80 directly, the health probe could
            # conflict if the host already has an nginx on :80. Safe to re-enable.
            disable: true
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

        security_opt:
            - no-new-privileges:true

volumes:
    gridoptima_storage:
    gridoptima_db:
