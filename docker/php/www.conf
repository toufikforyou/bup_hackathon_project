; Pool for Laravel — listens on a Unix socket because we share the container
; with nginx (php-fpm + nginx in one container, port 8000).

[www]
user  = www-data
group = www-data

listen       = /run/php-fpm/www.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm                   = dynamic
pm.max_children      = 8
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests      = 500

clear_env = no

; Make sure php-fpm env vars inherit from `docker run -e` / compose `environment`.
env[APP_ENV]      = $APP_ENV
env[APP_DEBUG]    = $APP_DEBUG
env[APP_URL]      = $APP_URL
env[APP_KEY]      = $APP_KEY
env[DB_CONNECTION] = $DB_CONNECTION
env[LOG_CHANNEL]   = $LOG_CHANNEL
env[CACHE_STORE]   = $CACHE_STORE
env[SESSION_DRIVER] = $SESSION_DRIVER
env[QUEUE_CONNECTION] = $QUEUE_CONNECTION

php_admin_value[error_log]    = /var/log/nginx/php-error.log
php_admin_flag[log_errors]    = on
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size]       = 4M

catch_workers_output = yes
decorate_workers_output = no
